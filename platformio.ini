; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Common properties
[common]
build_flags = -Wvla -Werror

[main]
build_flags =
    -DDECEPT_MAIN_TEST_PROGRAM

; Additional properties for use during testing
[testing]
build_flags =

; ---------------------------------------------------------------------------
;  Teensy
; ---------------------------------------------------------------------------

; Base properties
[teensy-base]
platform = teensy
platform_packages =
    toolchain-gccarmnoneeabi-teensy@https://github.com/ssilverman/teensy_betas.git#teensy_1.62/toolchain-gccarmnoneeabi-teensy/mac_x86_64
    framework-arduinoteensy@https://github.com/ssilverman/teensy_betas.git#teensy_1.62/framework-arduinoteensy
    tool-teensy@https://github.com/ssilverman/teensy_betas.git#teensy_1.62/tool-teensy/mac
framework = arduino
monitor_speed = 115200
build_unflags = -fpermissive -Wno-error=narrowing -Wno-maybe-uninitialized
build_flags = ${common.build_flags}
extra_scripts = post:scripts/extra_script.py

; Properties for a main program
[teensy-main]
extends = teensy-base
build_flags = ${teensy-base.build_flags} ${main.build_flags}

; Properties for tests
[teensy-test]
extends = teensy-base
build_type = test
build_flags = ${teensy-base.build_flags} ${testing.build_flags}
    -DBOOST_MATH_DISABLE_THREADS
    -I${PROJECT_TEST_DIR}
test_build_src = yes
lib_deps =
    https://github.com/boostorg/math.git#boost-1.91.0

[env:teensy41]
extends = teensy-main
board = teensy41

[env:teensy41-test]
extends = teensy-test
board = teensy41
